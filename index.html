<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丁家四色牌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');

:root {
  --yellow: #f5c842; --yellow-fg: #6b2800;
  --red-bg: #e8832a; --red-fg: #3a1000;
  --green-bg: #2FB248; --green-fg: #ffffff;
  --white-bg: #f0ede0; --white-fg: #222;
  --gold: #d4a017;
  --table: #1a5c2e;
  --table-dark: #0d3318;
  --panel: rgba(10,30,15,0.88);
  --border: rgba(212,160,23,0.45);
  --text: #f0e6c8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* 外層填滿視窗 */
body {
  font-family: 'Noto Serif TC', serif;
  background: var(--table-dark);
  color: var(--text);
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* 遊戲容器：固定 1280x740，transform-origin: top left，JS 計算縮放和偏移 */
#game-root {
  width: 1280px;
  height: 740px;
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  display: flex;
  flex-direction: column;
  background: var(--table-dark);
}

/* ── TITLE ── */
#title-bar {
  flex: 0 0 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: rgba(0,0,0,0.55);
  border-bottom: 1px solid var(--gold);
}
#title-bar h1 { font-size: 15px; color: var(--gold); letter-spacing: 4px; }
#round-info { font-size: 11px; color: rgba(212,160,23,0.7); }

/* ── MAIN ── */
#main {
  flex: 1;
  display: grid;
  grid-template-rows: 82px 1fr 185px;
  grid-template-columns: 110px 1fr 155px;
  gap: 5px;
  padding: 5px;
  min-height: 0;
}

/* ── CPU PANELS ── */
.cpu-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5px 8px;
  gap: 4px;
  min-width: 0;
}

.cpu-name {
  font-size: 12px; font-weight: 700; color: var(--gold);
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.turn-dot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 2px solid var(--gold); background: transparent;
  transition: background .3s, box-shadow .3s; flex-shrink: 0;
}
.turn-dot.active { background: var(--gold); box-shadow: 0 0 7px var(--gold); }

.cpu-stats { font-size: 10px; color: rgba(212,160,23,0.65); }

.card-pips { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.pip {
  width: 9px; height: 14px; border-radius: 2px;
  border: 1px solid rgba(0,0,0,0.4);
  background: linear-gradient(135deg,#1a3a2a 30%,#245035 60%,#1a3a2a 90%);
}

.cpu-melds { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
.meld-group { display: flex; gap: 1px; background: rgba(212,160,23,0.07); padding: 2px; border-radius: 3px; border: 1px solid rgba(212,160,23,0.22); }

/* Top spans full width */
#top-cpu {
  grid-column: 1/-1; grid-row: 1;
  flex-direction: row; justify-content: center; gap: 20px; padding: 6px 16px;
}

/* ── TABLE CENTER ── */
#table-center {
  grid-column: 2; grid-row: 2;
  background: radial-gradient(ellipse at 50% 35%, #1e6434 0%, #0e3a1c 100%);
  border-radius: 10px; border: 2px solid var(--gold);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 6px; padding: 8px; min-height: 0;
}

.discard-area { display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; }
.discard-area h4 { font-size: 9px; color: rgba(212,160,23,0.55); margin-bottom: 1px; }
.discard-cards { display: flex; flex-wrap: wrap; gap: 2px; }

#deck-col {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px; min-width: 60px;
}
#deck-stack { position: relative; width: 44px; height: 68px; }
.deck-back {
  position: absolute; width: 40px; height: 65px;
  border-radius: 4px; border: 2px solid var(--gold);
  background: repeating-linear-gradient(45deg,#1a3a2a,#1a3a2a 4px,#245035 4px,#245035 8px);
}
#deck-count { font-size: 10px; color: var(--gold); text-align: center; }

#last-disc-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
#last-disc-col h4 { font-size: 9px; color: rgba(212,160,23,0.55); }

/* ── PLAYER AREA ── */
#player-area {
  grid-column: 1/-1; grid-row: 3;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  display: flex; flex-direction: column; gap: 3px;
  padding: 5px 8px;
}

#player-top-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.player-name { font-size: 13px; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
#player-tai, #player-score { font-size: 11px; color: rgba(212,160,23,0.75); white-space: nowrap; }
#pending-banner { font-size: 11px; color: #ffe060; font-weight: 700; letter-spacing: 1px; }

#action-row { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }

#player-melds { display: flex; gap: 5px; flex-wrap: wrap; min-height: 0; }
.player-meld-group {
  display: flex; gap: 2px;
  background: rgba(212,160,23,0.07); padding: 2px 4px;
  border-radius: 4px; border: 1px solid rgba(212,160,23,0.28);
  flex-direction: column;
}
#player-melds-display .meld-type-label {
  font-size: 9px; color: rgba(212,160,23,0.75);
  display: block; margin-bottom: 2px;
}
#player-melds-display .meld-cards-row {
  display: flex; gap: 2px; flex-wrap: wrap;
}
.meld-type-label { font-size: 8px; color: rgba(212,160,23,0.65); }
.meld-cards-row { display: flex; gap: 2px; }

#player-hand {
  display: flex; gap: 3px; flex-wrap: nowrap;
  overflow-x: auto; padding-bottom: 3px;
  min-height: 72px; align-items: flex-end;
}
#player-hand::-webkit-scrollbar { height: 3px; }
#player-hand::-webkit-scrollbar-thumb { background: rgba(212,160,23,0.35); border-radius: 2px; }

/* ── CARDS ── */
.card {
  display: inline-flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 44px; height: 68px;
  border-radius: 5px; border: 2px solid rgba(0,0,0,0.28);
  cursor: pointer; position: relative;
  transition: transform .12s, box-shadow .12s;
  font-weight: 900; line-height: 1.1;
  box-shadow: 1px 2px 5px rgba(0,0,0,0.5);
  user-select: none; flex-shrink: 0;
}
.card .c-top { font-size: 17px; font-weight: 900; }
.card .c-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.45; margin: 2px 0; }
.card.yellow { background: var(--yellow);    color: var(--yellow-fg); border-color: #c09000; }
.card.red    { background: var(--red-bg);    color: var(--red-fg);    border-color: #a05010; }
.card.green  { background: var(--green-bg);  color: var(--green-fg);  border-color: #1a8030; }
.card.white  { background: var(--white-bg);  color: var(--white-fg);  border-color: #888880; }
.card:hover  { transform: translateY(-6px); box-shadow: 2px 8px 14px rgba(0,0,0,0.6); }
.card.selected { transform: translateY(-14px); box-shadow: 0 0 0 2px var(--gold),2px 10px 14px rgba(0,0,0,0.6); }

.card.sm {
  width: 26px; height: 40px; border-width: 1px; border-radius: 3px;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.4); cursor: default; flex-shrink: 0;
}
.card.sm:hover { transform: none; }
.card.sm .c-top { font-size: 11px; }
.card.sm .c-dot { width: 3px; height: 3px; margin: 1px 0; }

.card.xs {
  width: 18px; height: 28px; border-width: 1px; border-radius: 2px;
  box-shadow: none; cursor: default; flex-shrink: 0;
}
.card.xs:hover { transform: none; }
.card.xs .c-top { font-size: 8px; }
.card.xs .c-dot { display: none; }

/* 超小牌：右側明牌區用 */
.card.xxs {
  width: 20px; height: 30px; border-width: 1px; border-radius: 2px;
  box-shadow: none; cursor: default; flex-shrink: 0;
}
.card.xxs:hover { transform: none; }
.card.xxs .c-top { font-size: 9px; font-weight: 900; }
.card.xxs .c-dot { display: none; }

/* ── BUTTONS ── */
.btn {
  padding: 5px 12px;
  border: 2px solid var(--gold);
  background: rgba(212,160,23,0.08);
  color: var(--gold);
  font-family: 'Noto Serif TC', serif;
  font-size: 12px; font-weight: 700;
  border-radius: 5px; cursor: pointer;
  transition: background .15s, transform .1s;
  letter-spacing: 1px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: rgba(212,160,23,0.22); transform: translateY(-1px); }
.btn:disabled { opacity: 0.28; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: #1a1000; border-color: #a07000; }
.btn.primary:hover:not(:disabled) { background: #e0b820; }
.btn.danger { border-color: #e05030; color: #e05030; background: rgba(224,80,48,0.07); }
.btn.danger:hover:not(:disabled) { background: rgba(224,80,48,0.18); }
.btn.sm-btn { padding: 3px 9px; font-size: 10px; border-width: 1px; }

/* ── LOG BAR ── */
#log-bar {
  flex: 0 0 22px;
  display: flex; align-items: center; padding: 0 12px;
  background: rgba(0,0,0,0.45); border-top: 1px solid rgba(212,160,23,0.18);
  font-size: 10px; color: rgba(240,230,200,0.65);
  gap: 10px; overflow: hidden;
}
#log-latest { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#log-latest.imp { color: var(--gold); font-weight: 700; }
#log-toggle { font-size: 10px; color: rgba(212,160,23,0.45); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#log-toggle:hover { color: var(--gold); }

#log-drawer {
  display: none; position: fixed; bottom: 22px; right: 8px;
  width: 270px; max-height: 190px; overflow-y: auto;
  background: rgba(8,18,8,0.97); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px; font-size: 10px; z-index: 50;
  flex-direction: column-reverse;
}
#log-drawer.open { display: flex; }
.log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.log-entry.imp { color: var(--gold); font-weight: 700; }

/* ── TAI BREAKDOWN ── */
#tai-breakdown {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: flex-start;
  padding: 3px 5px;
  background: rgba(0,0,0,0.25);
  border-radius: 5px;
  border: 1px solid rgba(212,160,23,0.2);
  font-size: 9px;
  max-height: 52px;
  overflow-y: auto;
}
#tai-breakdown .tai-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
#tai-breakdown .tai-section-title {
  font-size: 9px;
  color: rgba(212,160,23,0.55);
  white-space: nowrap;
}
#tai-breakdown .tai-items {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
#tai-breakdown .tai-item {
  background: rgba(212,160,23,0.12);
  border: 1px solid rgba(212,160,23,0.3);
  border-radius: 3px;
  padding: 1px 4px;
  white-space: nowrap;
  color: var(--text);
  font-size: 9px;
}
#tai-breakdown .tai-item.highlight {
  background: rgba(212,160,23,0.28);
  color: var(--gold);
  font-weight: 700;
}
#tai-breakdown .tai-total {
  font-size: 15px;
  font-weight: 900;
  color: var(--gold);
  white-space: nowrap;
  padding: 0 6px;
  border-left: 1px solid rgba(212,160,23,0.3);
}
#tai-breakdown .tai-total.can-win {
  color: #6f6;
  text-shadow: 0 0 8px rgba(100,255,100,0.6);
}

/* ── MODAL ── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 100;
  align-items: center; justify-content: center;
}
#modal-overlay.open { display: flex; }
#modal-box {
  background: #0c2210; border: 2px solid var(--gold);
  border-radius: 12px; padding: 26px 30px;
  max-width: 420px; width: 90%; text-align: center;
}
#modal-box h2 { color: var(--gold); font-size: 20px; margin-bottom: 10px; }
#modal-box p { margin: 5px 0; font-size: 13px; line-height: 1.6; }
.modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

.chi-option {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 7px 10px; margin: 4px;
  border: 2px solid var(--gold); border-radius: 7px;
  background: rgba(212,160,23,0.07); cursor: pointer;
  transition: background .15s;
}
.chi-option:hover { background: rgba(212,160,23,0.22); }
.chi-option .chi-cards { display: flex; gap: 3px; }
.chi-option .chi-name { font-size: 10px; color: rgba(212,160,23,0.75); }
</style>
</head>
<body>
<div id="game-root">

<div id="title-bar">
  <h1>丁家四色牌</h1>
  <div id="round-info">第1局　莊家：你</div>
  <button class="btn sm-btn" onclick="newGame()">新遊戲</button>
</div>

<div id="main">

  <!-- TOP CPU -->
  <div class="cpu-panel" id="top-cpu">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;">
      <div class="cpu-name"><div class="turn-dot" id="dot-2"></div>電腦2（對家）</div>
      <div class="cpu-stats" id="stats-2">手牌20張　0台</div>
    </div>
    <div id="pips-2" class="card-pips" style="flex:1;"></div>
    <div id="melds-2" class="cpu-melds"></div>
  </div>

  <!-- LEFT CPU -->
  <div class="cpu-panel" id="left-cpu" style="grid-row:2;">
    <div class="cpu-name"><div class="turn-dot" id="dot-1"></div>電腦1</div>
    <div class="cpu-stats" id="stats-1">手牌20張　0台</div>
    <div id="pips-1" class="card-pips"></div>
    <div id="melds-1" class="cpu-melds" style="flex-direction:column;"></div>
  </div>

  <!-- TABLE CENTER -->
  <div id="table-center">
    <div class="discard-area">
      <h4>電腦1棄牌</h4><div class="discard-cards" id="disc-1"></div>
      <h4 style="margin-top:5px;">電腦2棄牌</h4><div class="discard-cards" id="disc-2"></div>
    </div>
    <div id="deck-col">
      <div id="deck-stack"></div>
      <div id="deck-count">牌堆 0張</div>
      <div id="last-disc-col">
        <h4>最新出牌</h4>
        <div id="last-disc"></div>
      </div>
    </div>
    <div class="discard-area">
      <h4>電腦3棄牌</h4><div class="discard-cards" id="disc-3"></div>
      <h4 style="margin-top:5px;">你的棄牌</h4><div class="discard-cards" id="disc-0"></div>
    </div>
  </div>

  <!-- RIGHT CPU + 玩家明牌區 -->
  <div style="grid-row:2;display:flex;flex-direction:column;gap:5px;">
    <div class="cpu-panel" id="right-cpu" style="flex:0 0 auto;">
      <div class="cpu-name"><div class="turn-dot" id="dot-3"></div>電腦3</div>
      <div class="cpu-stats" id="stats-3">手牌20張　0台</div>
      <div id="pips-3" class="card-pips"></div>
      <div id="melds-3" class="cpu-melds" style="flex-direction:column;"></div>
    </div>
    <div id="player-shown-melds" style="
      flex:1;background:rgba(10,30,15,0.7);border:1px solid rgba(212,160,23,0.4);
      border-radius:7px;padding:4px 5px;overflow-y:auto;min-height:0;
    ">
      <div style="font-size:8px;color:rgba(212,160,23,0.5);margin-bottom:3px;letter-spacing:1px;">你的明牌</div>
      <div id="player-melds-display"></div>
    </div>
  </div>

  <!-- PLAYER AREA -->
  <div id="player-area" style="grid-column:1/-1;grid-row:3;">
    <div id="player-top-row">
      <div class="player-name"><div class="turn-dot" id="dot-0"></div>你（莊家）</div>
      <div id="player-tai">0台</div>
      <div id="player-score">分數：0</div>
      <div id="pending-banner"></div>
      <div id="action-row">
        <button class="btn" id="btn-draw" onclick="playerDraw()">摸牌</button>
        <button class="btn primary" id="btn-discard" onclick="playerDiscard()" disabled>打牌</button>
        <button class="btn" id="btn-chi"  onclick="playerChi()"  disabled>吃</button>
        <button class="btn" id="btn-peng" onclick="playerPeng()" disabled>碰</button>
        <button class="btn" id="btn-gang" onclick="playerGang()" disabled>槓</button>
        <button class="btn danger" id="btn-hu" onclick="playerHu()" disabled>胡</button>
        <button class="btn" id="btn-pass" onclick="playerPass()" disabled>過</button>
      </div>
    </div>
    <div id="tai-breakdown"></div>
    <div id="player-hand"></div>
  </div>
</div>

<div id="log-bar">
  <div id="log-latest">遊戲開始</div>
  <div id="log-toggle" onclick="toggleLog()">▲ 記錄</div>
</div>
<div id="log-drawer"></div>

</div><!-- /game-root -->

<div id="modal-overlay">
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<script>
const CZH={yellow:'黃',red:'紅',green:'綠',white:'白'};

// 黃/紅 → 紅方棋子；綠/白 → 黑方棋子
// ══════════════════════════════════════════
//  音效系統（Web Audio API 合成）
// ══════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let _actx = null;
function getACtx(){
  if(!_actx) _actx = new AudioCtx();
  // 某些瀏覽器需要使用者互動後才能播放
  if(_actx.state === 'suspended') _actx.resume();
  return _actx;
}

// 通用播放函式
function playTone(cfg){
  try{
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = cfg.type || 'sine';
    osc.frequency.setValueAtTime(cfg.freq || 440, ctx.currentTime);
    if(cfg.freqEnd) osc.frequency.exponentialRampToValueAtTime(cfg.freqEnd, ctx.currentTime + cfg.dur);
    gain.gain.setValueAtTime(cfg.vol || 0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + cfg.dur);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + cfg.dur);
  }catch(e){}
}

// 🃏 打牌音效：短促的「咻」（高頻往下掃）
function sfxDiscard(){
  playTone({type:'sine', freq:800, freqEnd:200, vol:0.15, dur:0.12});
  setTimeout(()=>playTone({type:'triangle', freq:300, freqEnd:150, vol:0.08, dur:0.08}), 60);
}

// 🀄 碰牌音效：清脆的「啪」
function sfxPeng(){
  playTone({type:'square', freq:600, freqEnd:300, vol:0.12, dur:0.08});
  playTone({type:'sine',   freq:400, freqEnd:200, vol:0.10, dur:0.10});
}

// 🀄 槓牌音效：厚重的「碰碰」
function sfxGang(){
  playTone({type:'sawtooth', freq:300, freqEnd:150, vol:0.15, dur:0.12});
  setTimeout(()=>playTone({type:'sawtooth', freq:250, freqEnd:120, vol:0.15, dur:0.12}), 100);
}

// 🎉 胡牌音效：「登登登」三聲（上升音階）
function sfxHu(){
  const notes = [523, 659, 784]; // C5, E5, G5
  notes.forEach((freq, i) => {
    setTimeout(()=>{
      playTone({type:'sine', freq, freqEnd:freq*0.95, vol:0.25, dur:0.25});
      playTone({type:'triangle', freq:freq*2, vol:0.08, dur:0.2});
    }, i * 180);
  });
}

// 🃏 摸牌音效：輕柔的「唰」
function sfxDraw(){
  playTone({type:'sine', freq:200, freqEnd:400, vol:0.06, dur:0.08});
}

// 🃏 吃牌音效：兩聲短促
function sfxChi(){
  playTone({type:'sine', freq:500, freqEnd:400, vol:0.10, dur:0.07});
  setTimeout(()=>playTone({type:'sine', freq:600, freqEnd:500, vol:0.10, dur:0.07}), 80);
}

const COLOR_PIECES = {
  yellow: [{top:'帥',type:'general'},{top:'仕',type:'advisor'},{top:'相',type:'elephant'},
           {top:'俥',type:'chariot'},{top:'傌',type:'horse'},{top:'炮',type:'cannon'},{top:'兵',type:'soldier'}],
  red:    [{top:'帥',type:'general'},{top:'仕',type:'advisor'},{top:'相',type:'elephant'},
           {top:'俥',type:'chariot'},{top:'傌',type:'horse'},{top:'炮',type:'cannon'},{top:'兵',type:'soldier'}],
  green:  [{top:'將',type:'general'},{top:'士',type:'advisor'},{top:'象',type:'elephant'},
           {top:'車',type:'chariot'},{top:'馬',type:'horse'},{top:'包',type:'cannon'},{top:'卒',type:'soldier'}],
  white:  [{top:'將',type:'general'},{top:'士',type:'advisor'},{top:'象',type:'elephant'},
           {top:'車',type:'chariot'},{top:'馬',type:'horse'},{top:'包',type:'cannon'},{top:'卒',type:'soldier'}],
};
const COLORS = ['yellow','red','green','white'];

function buildDeck(){
  const d=[];let id=0;
  for(const color of COLORS)
    for(const p of COLOR_PIECES[color])
      for(let c=0;c<4;c++)  // 每色每張牌4張
        d.push({id:id++, color, top:p.top, type:p.type});
  return d; // 4色 × 7張 × 4張 = 112張
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let G={};

function nextRound(){
  const nextZhuang = G._nextZhuang ?? 0;
  const prevScores = [...G.scores];
  startGame(nextZhuang, prevScores);
}

function newGame(){
  startGame(0, [0,0,0,0]);
}

function startGame(zhuang, scores){
  hideModal();
  const deck=shuffle(buildDeck());
  // 依莊家位置發牌：莊家21張，其餘20張
  // 手牌陣列固定 index 0=玩家，重新對應座位
  const hands=[];
  for(let i=0;i<4;i++){
    hands[i] = deck.splice(0, i===zhuang ? 21 : 20);
  }
  for(let i=0;i<4;i++)sortHand(hands[i]);

  G={deck,hands,melds:[[],[],[],[]],discards:[[],[],[],[]],
    scores,currentPlayer:zhuang,zhuang,
    phase:'discard',hasDrawn:true,lastDiscard:null,lastDiscardBy:-1,
    selectedCard:null,waitingForReact:false,reactors:[],reactDone:[],
    gameOver:false,round:(G.round||0)+1,
    chiCardIds:new Set(),mustGang:null,_pendingCpuR:null,_nextZhuang:null};

  // 更新標題列莊家資訊
  const zhuangName = zhuang===0?'你':pn(zhuang);
  document.getElementById('round-info').textContent=`第${G.round}局　莊家：${zhuangName}`;

  // 更新玩家標籤
  document.querySelector('#dot-0').parentElement.childNodes.forEach(n=>{
    if(n.nodeType===3) n.textContent=''; // 清空文字節點
  });
  const playerLabel = document.querySelector('.player-name');
  if(playerLabel){
    playerLabel.lastChild.textContent = zhuang===0 ? '你（莊家）' : '你';
  }

  // B2: 起手暗槓（只針對玩家0）
  if(zhuang===0||true){ // 所有人都要檢查，但只對玩家0提示
    const ag0=canAGang(0);
    if(ag0){
      G.mustGang=ag0;
      log(`新局開始！莊家：${zhuangName}。你有暗槓（${CZH[ag0.color]}${ag0.top}），請先開槓！`,true);
    } else {
      if(zhuang===0) log('新局開始！你是莊家，請先打出一張牌。',true);
      else log(`新局開始！莊家：${zhuangName}。`,true);
    }
  }

  render();updateButtons();

  // 如果莊家是電腦，讓電腦先打牌
  if(zhuang!==0){
    setTimeout(()=>cpuDiscard(zhuang), 800);
  }
}

const TO={general:0,advisor:1,elephant:2,chariot:3,horse:4,cannon:5,soldier:6};
const CO={yellow:0,red:1,green:2,white:3};
// 排序：兵卒放最後，其餘先依顏色再依大小
function sortHand(h){
  h.sort((a,b)=>{
    const aSol=a.type==='soldier'?1:0, bSol=b.type==='soldier'?1:0;
    if(aSol!==bSol)return aSol-bSol; // 兵卒墊底
    return CO[a.color]-CO[b.color]||TO[a.type]-TO[b.type];
  });
}

function renderTaiBreakdown(){
  const el=document.getElementById('tai-breakdown');
  if(!el)return;
  el.innerHTML='';
  const hand=G.hands[0], melds=G.melds[0];

  // 桌面台數
  const meldTaiSum=meldsTai(0);

  // 手牌：用新版 evaluateHand
  const {canWin, tai:handTai} = evaluateHand(hand, false);
  const total = meldTaiSum + (canWin ? handTai : 0);

  // ── 桌面區塊 ──
  if(melds.length>0){
    const sec=makeTaiSection('桌面');
    melds.forEach(m=>{
      const t=mTai(m);
      addTaiItem(sec, mname(m)+' '+t+'台', t>0);
    });
    addTaiTotal(sec, meldTaiSum+'台');
    el.appendChild(sec);
  }

  // ── 手牌區塊（逐類分析） ──
  const handSec=makeTaiSection('手牌（最佳）');

  // 兵/卒分析
  const soldiers=hand.filter(c=>c.type==='soldier');
  if(soldiers.length>0){
    const colors=new Set(soldiers.map(c=>c.color));
    let solDesc, solTai;
    if(colors.size>=4){solDesc='四色兵卒';solTai=4;}
    else if(colors.size>=3){solDesc='三色兵卒';solTai=3;}
    else {
      // 看是否每色成對
      const byColor={};
      for(const c of soldiers){if(!byColor[c.color])byColor[c.color]=0;byColor[c.color]++;}
      const hasSingle=Object.values(byColor).some(n=>n<2);
      solDesc=soldierLabel(soldiers);
      solTai=0;
      if(hasSingle){
        addTaiItem(handSec, solDesc+'（單張，不能胡）', false);
      } else {
        addTaiItem(handSec, solDesc+'（對子，0台）', false);
      }
      soldiers.length=0; // 已處理，跳過下面
    }
    if(soldiers.length>0) addTaiItem(handSec, solDesc+' '+solTai+'台', solTai>0);
  }

  // 將/帥分析
  const generals=hand.filter(c=>c.type==='general');
  if(generals.length>0){
    const groups={};
    for(const c of generals){const k=c.color+c.top;if(!groups[k])groups[k]=[];groups[k].push(c);}
    for(const [k,cs] of Object.entries(groups)){
      const t=cs.length>=4?10:cs.length===3?6:cs.length===2?2:1;
      const colorName={yellow:'黃',red:'紅',green:'綠',white:'白'}[cs[0].color];
      addTaiItem(handSec, colorName+cs[0].top+'×'+cs.length+' '+t+'台', t>0);
    }
  }

  // 其他牌組台數（從 evaluateHand 總台數推算）
  const solTaiTotal = (()=>{
    const s=hand.filter(c=>c.type==='soldier');
    const col=new Set(s.map(c=>c.color));
    return col.size>=4?4:col.size>=3?3:0;
  })();
  const genTaiTotal = (()=>{
    const g=hand.filter(c=>c.type==='general');
    const grp={};
    for(const c of g){const k=c.color+c.top;if(!grp[k])grp[k]=0;grp[k]++;}
    return Object.values(grp).reduce((s,n)=>s+(n>=4?10:n===3?6:n===2?2:1),0);
  })();
  const otherTai = canWin ? Math.max(0, handTai - solTaiTotal - genTaiTotal) : 0;
  if(otherTai>0) addTaiItem(handSec, '牌組 '+otherTai+'台', true);
  if(!canWin) addTaiItem(handSec, '手牌無法完整成組', false);

  if(canWin) addTaiTotal(handSec, handTai+'台');
  el.appendChild(handSec);

  // ── 總計 ──
  const totalDiv=document.createElement('div');
  totalDiv.className=`tai-total${(canWin&&total>=10)?' can-win':''}`;
  totalDiv.textContent='總計 '+total+'台'+(canWin&&total>=10?' ✓':'');
  el.appendChild(totalDiv);

  document.getElementById('player-tai').textContent=total+'台';
}

// ── Tai calculation ──
function meldsTai(pid){return G.melds[pid].reduce((s,m)=>s+mTai(m),0);}

// ══════════════════════════════════════════
//  台數計算（完整版 v3）
//  修正：
//  1. 兵/卒也要完整分組（不能有散牌）
//  2. 暗刻（3張同色同字）不能被車馬包/將士象拆開
// ══════════════════════════════════════════

// mTai: 桌面（明牌）台數
function mTai(m){
  switch(m.type){
    case 'che-ma-bao':      return 1;
    case 'jiang-shi-xiang': return 2;
    case 'tri-soldier':     return 3;
    case 'quad-soldier':    return 4;
    case 'pair':            return 0;
    case 'ming-ke':         return m.isGeneral ? 4 : 1;
    case 'ming-gang':       return m.isGeneral ? 8 : 6;
    case 'an-gang':         return m.isGeneral ? 10 : 8;
    default: return 0;
  }
}

function mname(m){
  return{
    'che-ma-bao':'車馬包','jiang-shi-xiang':'將士象',
    'tri-soldier':'三色兵卒','quad-soldier':'四色兵卒',
    'pair':'對子','ming-ke':'碰','ming-gang':'明槓','an-gang':'暗槓'
  }[m.type]||m.type;
}

// 計算總台數，同時驗證手牌是否可胡
function calcTai(hand, melds, winMode=false) {
  const meldTaiSum = melds.reduce((s,m)=>s+mTai(m), 0);
  const {canWin, tai} = evaluateHand(hand, winMode);
  if (!canWin) return 0;
  return meldTaiSum + tai;
}

// 驗證手牌並計算台數
function evaluateHand(hand, winMode=false) {
  if (!hand.length) return {canWin:true, tai:0};
  const result = bestGroupTai(hand, winMode);
  return result.canWin ? {canWin:true, tai:result.tai} : {canWin:false, tai:0};
}

// winMode=false: 暗刻（3張同色同字）強制整組，不能拆
// winMode=true:  胡牌時例外，暗刻可以拆開組合（例如車馬包包包胡牌）
function bestGroupTai(cards, winMode=false) {
  if (!cards.length) return {canWin:true, tai:0};
  let best = {canWin:false, tai:0};
  const first=cards[0], rest=cards.slice(1);
  const sc=rest.filter(c=>same(c,first));

  function try_(tai, remain) {
    const sub = bestGroupTai(remain, winMode);
    if (sub.canWin && (!best.canWin || tai+sub.tai > best.tai))
      best = {canWin:true, tai:tai+sub.tai};
  }

  // ── 兵/卒 ──
  if (first.type === 'soldier') {
    const otherSol=rest.filter(c=>c.type==='soldier'&&c.color!==first.color);
    const u4=new Set([first.color]),p4=[];
    for(const c of otherSol){if(!u4.has(c.color)){p4.push(c);u4.add(c.color);}if(p4.length===3)break;}
    if(p4.length===3) try_(4, rest.filter(c=>!p4.includes(c)));
    const u3=new Set([first.color]),p3=[];
    for(const c of otherSol){if(!u3.has(c.color)){p3.push(c);u3.add(c.color);}if(p3.length===2)break;}
    if(p3.length===2) try_(3, rest.filter(c=>!p3.includes(c)));
    const sp=sc.length>=1?sc[0]:null;
    if(sp) try_(0, rest.filter(c=>c!==sp));
    return best; // 不允許兵卒散牌
  }

  // ── 將/帥 ──
  if (first.type === 'general') {
    if(sc.length>=3) try_(10, rest.filter(c=>!sc.slice(0,3).includes(c)));
    if(sc.length>=2) try_(6, rest.filter(c=>!sc.slice(0,2).includes(c)));
    // 將士象：平時只在1張時考慮；winMode 放寬
    if(sc.length<2 || winMode) {
      const c1=rest.find(c=>c.color===first.color&&c.type==='advisor');
      const c2=rest.find(c=>c.color===first.color&&c.type==='elephant');
      if(c1&&c2) try_(2, rest.filter(c=>c!==c1&&c!==c2));
    }
    if(sc.length>=1) try_(2, rest.filter(c=>c!==sc[0]));
    try_(1, rest);
    return best;
  }

  // ── 仕/士、相/象 ──
  if (['advisor','elephant'].includes(first.type)) {
    if(sc.length>=3) { try_(8, rest.filter(c=>!sc.slice(0,3).includes(c))); if(!winMode) return best; }
    if(sc.length>=2) { try_(3, rest.filter(c=>!sc.slice(0,2).includes(c))); if(!winMode) return best; }
    const need=['general','advisor','elephant'].filter(t=>t!==first.type);
    const c1=rest.find(c=>c.color===first.color&&c.type===need[0]);
    const c2=rest.find(c=>c.color===first.color&&c.type===need[1]);
    if(c1&&c2) try_(2, rest.filter(c=>c!==c1&&c!==c2));
    const pair=sc.length>=1?sc[0]:null;
    if(pair) try_(0, rest.filter(c=>c!==pair));
    return best;
  }

  // ── 俥/車、傌/馬、炮/包 ──
  if (['chariot','horse','cannon'].includes(first.type)) {
    if(sc.length>=3) { try_(8, rest.filter(c=>!sc.slice(0,3).includes(c))); if(!winMode) return best; }
    if(sc.length>=2) { try_(3, rest.filter(c=>!sc.slice(0,2).includes(c))); if(!winMode) return best; }
    const need=['chariot','horse','cannon'].filter(t=>t!==first.type);
    const c1=rest.find(c=>c.color===first.color&&c.type===need[0]);
    const c2=rest.find(c=>c.color===first.color&&c.type===need[1]);
    if(c1&&c2) try_(1, rest.filter(c=>c!==c1&&c!==c2));
    const pair=sc.length>=1?sc[0]:null;
    if(pair) try_(0, rest.filter(c=>c!==pair));
    return best;
  }

  return best;
}

// ── Checks ──
function same(a,b){return a.color===b.color&&a.top===b.top;}
function cntIn(hand,card){return hand.filter(c=>same(c,card)).length;}


function chiOpts(pid,card){
  if(!card||G.lastDiscardBy===pid)return[];
  // 規則：只能吃上家（逆時針的前一家）的牌
  // 順序逆時針：0→3→2→1→0，所以 pid 的上家是 (pid+1)%4
  const upstream=(pid+1)%4;
  if(G.lastDiscardBy!==upstream)return[];
  const hand=G.hands[pid],opts=[];
  if(['chariot','horse','cannon'].includes(card.type)){
    const need=['chariot','horse','cannon'].filter(t=>t!==card.type);
    const c1=hand.find(c=>c.color===card.color&&c.type===need[0]);
    const c2=hand.find(c=>c.color===card.color&&c.type===need[1]);
    if(c1&&c2)opts.push({type:'che-ma-bao',with:[c1,c2],card});
  }
  if(['general','advisor','elephant'].includes(card.type)){
    // B3: 將/帥不能被吃出
    if(card.type==='general')return opts;
    const need=['general','advisor','elephant'].filter(t=>t!==card.type);
    const c1=hand.find(c=>c.color===card.color&&c.type===need[0]);
    const c2=hand.find(c=>c.color===card.color&&c.type===need[1]);
    if(c1&&c2)opts.push({type:'jiang-shi-xiang',with:[c1,c2],card});
  }
  if(card.type==='soldier'){
    // 兵/卒可以混合（兵+卒都算 soldier），只要顏色不同
    // 三色：hand裡找2張不同色的 soldier
    const others=hand.filter(c=>c.type==='soldier'&&c.color!==card.color);
    const used=new Set([card.color]),picked=[];
    for(const c of others)if(!used.has(c.color)){picked.push(c);used.add(c.color);}
    if(picked.length>=3)opts.push({type:'quad-soldier',with:picked.slice(0,3),card});
    else if(picked.length>=2)opts.push({type:'tri-soldier',with:picked.slice(0,2),card});
  }
  // 對子（非將帥才能成對吃）
  if(card.type!=='general'){
    const m=hand.find(c=>same(c,card));
    if(m)opts.push({type:'pair',with:[m],card});
  }
  return opts;
}

function canChi(pid,card){return chiOpts(pid,card).length>0;}
function canPeng(pid,card){if(!card||G.lastDiscardBy===pid)return false;return cntIn(G.hands[pid],card)>=2;}
function canMGang(pid,card){if(!card||G.lastDiscardBy===pid)return false;return cntIn(G.hands[pid],card)>=3;}
function canAGang(pid){
  const cnt={};
  for(const c of G.hands[pid]){const k=`${c.color}-${c.top}`;cnt[k]=(cnt[k]||0)+1;if(cnt[k]>=4)return c;}
  return null;
}
function canHuR(pid,card){
  if(!card||G.lastDiscardBy===pid)return false;
  if(cntIn(G.hands[pid],card)>=3) return false;
  const testHand=[...G.hands[pid],card];
  const meldSum=G.melds[pid].reduce((s,m)=>s+mTai(m),0);
  const {canWin,tai}=evaluateHand(testHand,true);
  if(pid===0&&canWin&&meldSum+tai>=10){
    console.log('[canHuR] tai='+tai+' meldSum='+meldSum+' total='+(meldSum+tai));
    console.log('[canHuR] hand='+testHand.map(c=>c.color+c.top).join(','));
    console.log('[canHuR] melds='+G.melds[pid].map(m=>mname(m)+mTai(m)+'台').join(','));
  }
  return canWin && meldSum+tai>=10;
}
function canHuS(pid){
  const meldSum=G.melds[pid].reduce((s,m)=>s+mTai(m),0);
  const {canWin,tai}=evaluateHand(G.hands[pid],true);
  if(pid===0&&canWin&&meldSum+tai>=10){
    console.log('[canHuS] tai='+tai+' meldSum='+meldSum+' total='+(meldSum+tai));
    console.log('[canHuS] hand='+G.hands[pid].map(c=>c.color+c.top).join(','));
    console.log('[canHuS] melds='+G.melds[pid].map(m=>mname(m)+mTai(m)+'台').join(','));
  }
  return canWin && meldSum+tai>=10;
}

// ── Buttons ──
function updateButtons(){
  try {
    const my=G.currentPlayer===0;
    const react=G.waitingForReact&&!G.reactDone.includes(0)&&G.reactors.includes(0);
    const card=G.lastDiscard;
    const ok=!G.gameOver;
    setBtn('btn-draw', ok&&my&&!G.hasDrawn&&G.deck.length>0&&!G.waitingForReact);
    // B2: 強制開槓時不能打牌
    const forcedGang=!!(G.mustGang&&my&&G.phase==='discard');
    setBtn('btn-discard', ok&&my&&G.phase==='discard'&&G.hasDrawn&&!!G.selectedCard&&!G.waitingForReact&&!forcedGang);
    // 強制開槓時槓按鈕要亮起
    setBtn('btn-chi',  ok&&react&&canChi(0,card));
    setBtn('btn-peng', ok&&react&&canPeng(0,card));
    setBtn('btn-gang', ok&&((react&&canMGang(0,card))||(my&&G.phase==='discard'&&G.hasDrawn&&(!!canAGang(0)||!!G.mustGang))));
    let huS=false;
    try{ huS=my&&G.phase==='discard'&&G.hasDrawn&&canHuS(0); }catch(e){}
    let huR=false;
    try{ huR=react&&canHuR(0,card); }catch(e){}
    setBtn('btn-hu', ok&&(huR||huS));
    setBtn('btn-pass', ok&&react);
  } catch(e) {
    console.error('updateButtons error:', e);
  }
}
function setBtn(id,en){document.getElementById(id).disabled=!en;}

function selectCard(card){
  if(G.currentPlayer!==0||G.phase!=='discard'||G.waitingForReact)return;
  G.selectedCard=(G.selectedCard&&G.selectedCard.id===card.id)?null:card;
  renderPlayer();updateButtons();
}

// ── Player actions ──
function playerDraw(){
  if(G.currentPlayer!==0||G.hasDrawn||G.deck.length===0)return;
  const c=G.deck.pop();G.hands[0].push(c);G.hasDrawn=true;G.phase='discard';
  sortHand(G.hands[0]);sfxDraw();log(`你摸了一張牌`);
  // B2: 有暗槓必須強制開
  const ag=canAGang(0);
  if(ag){
    log(`你有暗槓（${CZH[ag.color]}${ag.top}），必須開槓！`,true);
    G.mustGang=ag; // 標記強制開槓
  } else {
    G.mustGang=null;
  }
  render();updateButtons();
}

function playerDiscard(){
  if(!G.selectedCard||G.currentPlayer!==0||G.phase!=='discard'||G.waitingForReact)return;
  const card=G.selectedCard;
  // B1: 吃進來的牌不能打出
  if(G.chiCardIds.has(card.id)){
    log('這張牌是吃進來的，不能打出！',true); return;
  }
  // B3: 將/帥不能打出去
  if(card.type==='general'){
    log('將/帥不能打出去！',true); return;
  }
  doDiscard(0,card);G.selectedCard=null;
}

function doDiscard(pid,card){
  const i=G.hands[pid].findIndex(c=>c.id===card.id);if(i===-1)return;
  G.hands[pid].splice(i,1);G.discards[pid].push(card);
  G.lastDiscard=card;G.lastDiscardBy=pid;G.hasDrawn=false;
  if(pid===0) sfxDiscard(); else sfxDiscard();
  log(`${pn(pid)} 打出 ${CZH[card.color]}${card.top}`);
  render();startReact(pid,card);
}

function playerChi(){
  if(!G.waitingForReact||G.reactDone.includes(0))return;
  const opts=chiOpts(0,G.lastDiscard);if(!opts.length)return;
  if(opts.length===1)doChi(0,opts[0]);else showChiModal(opts);
}
function showChiModal(opts){
  let html='<p>選擇吃牌組合：</p><div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px;">';
  opts.forEach((o,i)=>{
    const cards=[o.card,...o.with];
    const ch=cards.map(c=>`<div style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:33px;border-radius:3px;border:1px solid rgba(0,0,0,.3);font-size:10px;font-weight:900;background:${cbg(c.color)};color:${cfg(c.color)};">${c.top}</div>`).join('');
    html+=`<div class="chi-option" onclick="doChiC(${i})"><div class="chi-cards">${ch}</div><div class="chi-name">${mname({type:o.type})}</div></div>`;
  });
  html+='</div>';
  window._cOpts=opts;showModal('選擇吃牌',html,[]);
}
window.doChiC=function(i){hideModal();doChi(0,window._cOpts[i]);};
function cbg(c){return{yellow:'#f5c842',red:'#f8c8b8',green:'#b0e0c0',white:'#f0ede0'}[c]||'#eee';}
function cfg(c){return{yellow:'#6b2800',red:'#5a0000',green:'#003a10',white:'#222'}[c]||'#000';}

function doChi(pid,opt){
  for(const c of opt.with){const i=G.hands[pid].findIndex(x=>x.id===c.id);if(i!==-1)G.hands[pid].splice(i,1);}
  rmDisc(G.lastDiscardBy,G.lastDiscard);
  const mc=[opt.card,...opt.with];sortHand(mc);
  G.melds[pid].push({type:opt.type,cards:mc,hidden:false});
  // B1: 記錄吃進來的牌，不能再打出
  if(pid===0) G.chiCardIds.add(opt.card.id);
  sfxChi();log(`${pn(pid)} 吃了 ${mname({type:opt.type})}！`,true);
  endReact(pid);
}

function playerPeng(){if(!G.waitingForReact||G.reactDone.includes(0)||!canPeng(0,G.lastDiscard))return;doPeng(0);}
function doPeng(pid){
  const card=G.lastDiscard;
  // 從手牌取出實際的牌物件（保留正確的 side/top/color）
  const taken=[];
  for(let i=G.hands[pid].length-1;i>=0&&taken.length<2;i--){
    if(same(G.hands[pid][i],card)){taken.push(G.hands[pid].splice(i,1)[0]);}
  }
  rmDisc(G.lastDiscardBy,card);
  const mc=[card,...taken]; // 3張，全部是正確的牌物件
  G.melds[pid].push({type:'ming-ke',cards:mc,hidden:false,isGeneral:card.type==='general'});
  sfxPeng();log(`${pn(pid)} 碰了 ${CZH[card.color]}${card.top}！`,true);
  endReact(pid);
}

function playerGang(){
  const react=G.waitingForReact&&!G.reactDone.includes(0)&&G.reactors.includes(0);
  if(react&&canMGang(0,G.lastDiscard)){doMGang(0);return;}
  if(G.currentPlayer===0&&G.phase==='discard'&&G.hasDrawn){
    // 強制開槓 or 一般暗槓
    const ag=G.mustGang||canAGang(0);
    if(ag){doAGang(0,ag);G.mustGang=null;}
  }
}
function doMGang(pid){
  const card=G.lastDiscard;
  const taken=[];
  for(let i=G.hands[pid].length-1;i>=0&&taken.length<3;i--)if(same(G.hands[pid][i],card)){taken.push(G.hands[pid].splice(i,1)[0]);}
  rmDisc(G.lastDiscardBy,card);
  const mc=[card,...taken];
  G.melds[pid].push({type:'ming-gang',cards:mc,hidden:false,isGeneral:card.type==='general'});
  sfxGang();log(`${pn(pid)} 明槓 ${CZH[card.color]}${card.top}！(6台)`,true);
  G.waitingForReact=false;G.lastDiscard=null;
  drawGang(pid);
}
function doAGang(pid,card){
  const taken=[];
  for(let i=G.hands[pid].length-1;i>=0&&taken.length<4;i--)if(same(G.hands[pid][i],card)){taken.push(G.hands[pid].splice(i,1)[0]);}
  G.melds[pid].push({type:'an-gang',cards:taken,hidden:true,isGeneral:card.type==='general'});
  sfxGang();log(`${pn(pid)} 暗槓！(8台)`,true);drawGang(pid);
}
function drawGang(pid){
  if(G.deck.length>0){const d=G.deck.pop();G.hands[pid].push(d);sortHand(G.hands[pid]);log(`${pn(pid)} 補牌`);}
  G.currentPlayer=pid;G.phase='discard';G.hasDrawn=true;
  if(pid!==0){render();setTimeout(()=>cpuDiscard(pid),700);}else{render();updateButtons();}
}

function playerHu(){
  const react=G.waitingForReact&&!G.reactDone.includes(0)&&G.reactors.includes(0);
  if(react&&canHuR(0,G.lastDiscard)){declHu(0,G.lastDiscardBy,G.lastDiscard,false);return;}
  if(G.currentPlayer===0&&G.phase==='discard'&&G.hasDrawn&&canHuS(0))declHu(0,-1,null,true);
}
function declHu(winner,loser,card,self){
  G.waitingForReact=false;G.gameOver=true;
  const th=self?G.hands[winner]:[...G.hands[winner],card];
  const tai=calcTai(th,G.melds[winner]);
  sfxHu();log(`🀄 ${pn(winner)} ${self?'自摸':'胡牌'}！${tai}台`,true);
  if(winner===0||loser===0)G.scores[0]+=(winner===0?tai:-tai);
  // 胡牌者成為下一輪莊家
  G._nextZhuang=winner;
  render();
  const winnerName=pn(winner);
  showModal(`🀄 ${winnerName} ${self?'自摸':'胡牌'}！`,
    `<p><strong>${tai} 台</strong></p>${!self&&loser>=0?`<p>放銃：${pn(loser)}</p>`:''}<hr style="border-color:rgba(212,160,23,.3);margin:8px 0;"><p>下一局莊家：<strong>${winnerName}</strong></p><p>累積分數：<strong>${G.scores[0]}</strong></p>`,
    [{text:'繼續新局',action:'nextRound()'}]);
}

function playerPass(){
  if(!G.waitingForReact||G.reactDone.includes(0))return;
  G.reactDone.push(0);log('你選擇過');
  // 如果有待處理的CPU反應（玩家優先胡牌情境），現在繼續
  if(G._pendingCpuR){playerHuOrPass_afterDecide();}
  else{chkReact();}
}

// ── Reaction ──
function startReact(by,card){
  // 1. 先找所有能胡的人
  const huPlayers=[];
  for(let i=0;i<4;i++){if(i!==by&&canHuR(i,card))huPlayers.push(i);}

  // 2. 有人能胡時：胡優先，碰/吃/槓全部暫停
  if(huPlayers.length>0){
    // CPU能胡→直接宣告（CPU不需要選擇）
    const cpuHu=huPlayers.filter(i=>i!==0);
    if(cpuHu.length>0){declHu(cpuHu[0],by,card,false);return;}

    // 玩家0能胡→顯示胡/過選項，CPU全部等待（包含能碰/槓的CPU）
    if(huPlayers.includes(0)){
      const allCpuR=[];
      for(let i=1;i<4;i++){
        if(i!==by&&(canMGang(i,card)||canPeng(i,card)||canChi(i,card)))allCpuR.push(i);
      }
      G.waitingForReact=true;
      G.reactors=[0];  // 只有玩家0需要決定
      G.reactDone=[];
      G._pendingCpuR=allCpuR; // CPU等玩家決定後再反應
      render();updateButtons();
      return;
    }
  }

  // 3. 沒人能胡→正常處理碰/槓/吃
  const rs=[];
  for(let i=0;i<4;i++){
    if(i===by)continue;
    if(canMGang(i,card)||canPeng(i,card)||canChi(i,card))rs.push(i);
  }
  if(!rs.length){nextTurn(by);return;}

  G.waitingForReact=true;G.reactors=rs;G.reactDone=[];
  G._pendingCpuR=null;
  render();updateButtons();

  const cpuR=rs.filter(i=>i!==0);
  if(cpuR.length)setTimeout(()=>cpuReactAll(cpuR,0),500);
  if(!rs.includes(0)){G.reactDone.push(0);chkReact();}
}

function playerHuOrPass_afterDecide(){
  // 玩家決定後，讓CPU繼續反應
  const cpuR=G._pendingCpuR||[];
  G._pendingCpuR=null;
  if(cpuR.length)setTimeout(()=>cpuReactAll(cpuR,0),400);
  else chkReact();
}

function cpuReactAll(list,idx){
  if(idx>=list.length){continueReact();return;}
  const pid=list[idx];const card=G.lastDiscard;
  if(G.gameOver||!G.waitingForReact)return;
  if(canHuR(pid,card)){declHu(pid,G.lastDiscardBy,card,false);return;}
  if(canMGang(pid,card)){doMGang(pid);return;}
  if(canPeng(pid,card)){doPeng(pid);return;}
  G.reactDone.push(pid);
  setTimeout(()=>cpuReactAll(list,idx+1),350);
}

function continueReact(){
  if(!G.reactDone.includes(0)&&G.reactors.includes(0)){render();updateButtons();return;}
  chkReact();
}
function chkReact(){
  if(G.reactors.every(i=>G.reactDone.includes(i))){
    G.waitingForReact=false;render();updateButtons();
    setTimeout(()=>nextTurn(G.lastDiscardBy),150);
  }
}

function endReact(pid){
  G.waitingForReact=false;G.lastDiscard=null;
  G.currentPlayer=pid;G.phase='discard';G.hasDrawn=true;
  if(pid!==0){render();setTimeout(()=>cpuDiscard(pid),700);}else{render();updateButtons();}
}

// ── Turn flow ──
function nextTurn(prev){
  const next=(prev+3)%4;
  G.currentPlayer=next;G.phase='draw';G.hasDrawn=false;G.drawnCard=null;
  if(G.deck.length<=6){
    log('牌堆不足，流局！',true);
    showModal('流局','牌堆不足6張，此局流局。',[{text:'重新開始',action:'newGame()'}]);return;
  }
  render();
  if(next===0){log('輪到你摸牌');updateButtons();}
  else setTimeout(()=>cpuTurn(next),550);
}

function cpuTurn(pid){
  if(G.gameOver||G.deck.length===0)return;
  const c=G.deck.pop();G.hands[pid].push(c);G.hasDrawn=true;log(`${pn(pid)} 摸牌`);
  const ag=canAGang(pid);if(ag){render();setTimeout(()=>doAGang(pid,ag),450);return;}
  if(canHuS(pid)){render();setTimeout(()=>declHu(pid,-1,null,true),450);return;}
  render();setTimeout(()=>cpuDiscard(pid),650);
}

function cpuDiscard(pid){
  if(G.gameOver||!G.hands[pid].length)return;
  const hand=G.hands[pid];
  // B3: 將/帥不能打出，過濾掉
  const discardable=hand.filter(c=>c.type!=='general');
  if(!discardable.length){log(`${pn(pid)} 無牌可打（全是將帥）`);return;}
  let best=0,bs=Infinity;
  for(let i=0;i<discardable.length;i++){
    const c=discardable[i];
    let s=0;
    s+=discardable.filter((x,j)=>j!==i&&same(x,c)).length*4;
    const CMB=['chariot','horse','cannon'],GEN=['advisor','elephant'];
    s+=discardable.filter((x,j)=>j!==i&&x.color===c.color&&
      ((CMB.includes(c.type)&&CMB.includes(x.type))||(GEN.includes(c.type)&&GEN.includes(x.type)))).length*2;
    if(s<bs){bs=s;best=i;}
  }
  doDiscard(pid,discardable[best]);
}

function rmDisc(pid,card){const i=G.discards[pid].findIndex(c=>c.id===card.id);if(i!==-1)G.discards[pid].splice(i,1);}
function pn(i){return i===0?'你':`電腦${i}`;}

// ── Log ──
let logOpen=false;
function log(msg,imp=false){
  const ll=document.getElementById('log-latest');ll.textContent=msg;ll.className=imp?'imp':'';
  const dr=document.getElementById('log-drawer');
  const e=document.createElement('div');e.className=`log-entry${imp?' imp':''}`;e.textContent=msg;
  dr.prepend(e);if(dr.children.length>60)dr.removeChild(dr.lastChild);
}
function toggleLog(){logOpen=!logOpen;document.getElementById('log-drawer').className=logOpen?'open':'';}

// ── Modal ──
function showModal(title,body,btns){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  const bEl=document.getElementById('modal-btns');bEl.innerHTML='';
  btns.forEach(b=>{const btn=document.createElement('button');btn.className='btn primary';btn.textContent=b.text;btn.onclick=()=>{hideModal();eval(b.action);};bEl.appendChild(btn);});
  document.getElementById('modal-overlay').className='open';
}
function hideModal(){document.getElementById('modal-overlay').className='';}

// ── 自動縮放：讓 1280x740 的遊戲適應任何視窗大小 ──
function autoScale(){
  const root=document.getElementById('game-root');
  if(!root)return;
  const W=window.innerWidth, H=window.innerHeight;
  const scaleX=W/1280, scaleY=H/740;
  const scale=Math.min(scaleX,scaleY); // 完全填滿，不留空白
  // transform-origin: top left，所以要手動偏移讓畫面置中
  const offsetX=(W - 1280*scale)/2;
  const offsetY=(H - 740*scale)/2;
  root.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}
window.addEventListener('resize',autoScale);
document.addEventListener('DOMContentLoaded',autoScale);

newGame();
setTimeout(autoScale,100); // 字型載入後再算一次
</script>
